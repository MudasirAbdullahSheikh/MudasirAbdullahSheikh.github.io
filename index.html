<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #004080;
        }

        p {
            font-size: 20px;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>

</head>

<body>

    <h1>Welcome to My First Website</h1>

    <h2>Learning Website Hosting</h2>

    <p>
        This is my first website created using HTML.
    </p>

    <p>
        Soon this website will be available worldwide!
    </p>

    <button onclick="showMessage()">
        Click Here
    </button>

    <script>
        function showMessage() {
            alert("Congratulations! Your website is working.");
        }
    </script>

</body>
</html>
